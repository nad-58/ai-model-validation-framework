name: public-readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q src tests examples

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Run all examples
        shell: bash
        run: |
          set -euo pipefail
          for script in $(find examples -type f -name '*.py' | sort); do
            echo "Running ${script}"
            python "${script}"
          done

      - name: Build and check package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Scan full Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect \
            --source=/repo \
            --redact \
            --verbose \
            --exit-code=1
