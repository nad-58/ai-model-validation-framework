name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run basic validation demo
        run: |
          PYTHONPATH=src python examples/demo_validation_report.py
      - name: Run fairness subgroup validation demo
        run: |
          PYTHONPATH=src python examples/fairness_subgroup_validation_report.py
      - name: Run LLM RAG evaluation demo
        run: |
          PYTHONPATH=src python examples/llm_rag_evaluation_report.py
